name: Sabarimala Virtual-Q Monitor

on:
  # Schedule stays off until a successful run is confirmed on the
  # self-hosted runner (workflow_dispatch below). GitHub-hosted runners are
  # blocked outright by the portal's bot detection (confirmed -- run
  # 35519187438 got served a "confirm you are human" challenge before even
  # reaching the login page), which is why this moved to self-hosted.
  # schedule:
  #   - cron: '30 2,14 * * *'   # 8:00 AM and 8:00 PM IST (02:30 / 14:30 UTC)
  workflow_dispatch:              # manual trigger from GitHub UI still works

permissions:
  contents: write   # needed to commit back logs/last_state.json

jobs:
  check:
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version   # uses the Mac's own system Python3 --
                                  # actions/setup-python@v5 assumes the
                                  # hosted-runner home dir (/Users/runner)
                                  # for its tool cache, which fails here

      - name: Install dependencies
        run: |
          # Pinned to 1.61.0: this runner is stuck on macOS 13 (Ventura,
          # last supported OS for its 2017 hardware), and Playwright
          # dropped Chromium support for mac13 in 1.62.0 (confirmed via
          # playwright-core's registry DOWNLOAD_PATHS across release
          # tags -- defined in release-1.61, undefined in release-1.62).
          # Bump this only after the runner machine is upgraded/replaced.
          pip3 install "playwright==1.61.0"
          playwright install chromium

      - name: Run calendar monitor
        env:
          SABARIMALA_USERNAME: ${{ secrets.SABARIMALA_USERNAME }}
          SABARIMALA_PASSWORD: ${{ secrets.SABARIMALA_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HEADLESS: 'true'
        run: python3 sabarimala_monitor.py

      - name: Commit updated state (if changed)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/last_state.json
          git diff --cached --quiet || git commit -m "Update calendar state [skip ci]"
          git push || true

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            logs/run_*.log
            logs/screenshot_*.png
            logs/status_*.txt
          retention-days: 7
          if-no-files-found: ignore
